# Pipeline de qualidade do site PA-34 (work-modulo-3d/; app/ está congelado e fica fora).
# Gerado com BMad TEA (bmad-testarch-ci). Detalhes: docs/ci.md.
#
#   lint     — informativo: erros React Compiler pré-existentes (ledger) não bloqueiam;
#              o lint de tests/ e playwright.config.ts bloqueia.
#   verify   — build + contratos de fonte, integridade do GLB, loader e foco (precisa de LFS).
#   e2e      — Playwright em 2 shards, retries=2 em CI.
#   burn-in  — PRs e semanal: suíte completa 5× (repeat-each) para detectar flakiness.
#   report   — resumo no job summary; falha se algum gate bloqueante falhou.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # burn-in semanal, segunda 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint dos testes (bloqueante)
        working-directory: work-modulo-3d
        run: npx eslint tests playwright.config.ts

      - name: Lint completo (informativo — dívida pré-existente no ledger)
        continue-on-error: true
        run: npm --prefix work-modulo-3d run lint

  verify:
    name: Verify (build + contratos + GLB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Conferir que o GLB não é ponteiro LFS
        run: |
          head -c 4 work-modulo-3d/public/models/pa34-camadas.glb | grep -q glTF \
            || { echo "::error::pa34-camadas.glb não foi baixado via LFS"; exit 1; }

      - uses: ./.github/actions/setup
      - run: npm --prefix work-modulo-3d run verify

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup
        with:
          browsers: "true"

      - name: Listar testes do shard
        id: list
        working-directory: work-modulo-3d
        # --list também grava junit.xml; por isso roda antes da execução real.
        run: |
          n=$(npx playwright test --list --reporter=list --shard=${{ matrix.shard }}/2 | sed -n 's/^Total: \([0-9]*\) tests.*/\1/p')
          echo "expected=$n" >> "$GITHUB_OUTPUT"

      - name: Playwright (shard ${{ matrix.shard }}/2)
        working-directory: work-modulo-3d
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Conferir contagem executada
        working-directory: work-modulo-3d
        env:
          expected: ${{ steps.list.outputs.expected }}
        run: |
          # Gate: falha se o shard executou menos testes do que o listado (cobertura silenciosamente perdida).
          ran=$(sed -n 's/.*<testsuites[^>]* tests="\([0-9]*\)".*/\1/p' test-results/junit.xml | head -1)
          skipped=$(sed -n 's/.*<testsuites[^>]* skipped="\([0-9]*\)".*/\1/p' test-results/junit.xml | head -1)
          echo "listados=$expected executados=$ran pulados=$skipped"
          if [ -z "$expected" ] || [ "$ran" != "$expected" ] || [ "${skipped:-0}" != "0" ]; then
            echo "::error::Contagem divergente: listados=$expected executados=$ran pulados=$skipped"
            exit 1
          fi

      - name: Upload artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            work-modulo-3d/test-results/
            work-modulo-3d/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  burn-in:
    name: Burn-in (5×)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup
        with:
          browsers: "true"

      - name: Suíte completa 5× sem retries
        working-directory: work-modulo-3d
        run: npx playwright test --repeat-each=5 --retries=0 --fail-on-flaky-tests

      - name: Upload falhas do burn-in
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failures
          path: |
            work-modulo-3d/test-results/
            work-modulo-3d/playwright-report/
          retention-days: 14

  report:
    name: Resumo
    runs-on: ubuntu-latest
    needs: [lint, verify, e2e, burn-in]
    if: always()
    steps:
      - name: Resumo e gate final
        env:
          LINT: ${{ needs.lint.result }}
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.e2e.result }}
          BURN_IN: ${{ needs.burn-in.result }}
        run: |
          {
            echo "## PA-34 — qualidade"
            echo ""
            echo "| Gate | Resultado |"
            echo "| --- | --- |"
            echo "| Lint (testes bloqueante, app informativo) | $LINT |"
            echo "| Verify (build, contratos, GLB) | $VERIFY |"
            echo "| E2E Playwright (P0/P1 = 100%) | $E2E |"
            echo "| Burn-in 5× | $BURN_IN |"
            echo ""
            echo "Artefatos: relatório HTML, JUnit, traces e vídeos em **e2e-shard-***; falhas de burn-in em **burn-in-failures**."
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$LINT" "$VERIFY" "$E2E"; do
            [ "$r" = "success" ] || { echo "::error::Gate bloqueante falhou"; exit 1; }
          done
          case "$BURN_IN" in success|skipped) ;; *) echo "::error::Burn-in detectou falha ou instabilidade"; exit 1;; esac
